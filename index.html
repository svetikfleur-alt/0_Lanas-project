<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StyleSelf — AI-гайд для фотосессии</title>
    <meta
      name="description"
      content="StyleSelf помогает понять свой визуальный стиль до фотосессии и прийти к съёмке с готовым планом, а не чужими референсами."
    />
    <meta name="theme-color" content="#fcf8f3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./index.css" />
    <script defer src="./index.js"></script>
  </head>
  <body>
    <header class="site-header" id="siteHeader">
      <div class="container header-inner">
        <a class="brand" href="#top" aria-label="StyleSelf">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </span>
          <span class="brand-name">StyleSelf</span>
        </a>

        <div class="header-actions">
          <div class="locale-switch" id="localeSwitch" aria-label="Language switcher">
            <span class="locale-globe" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M2 12h20"></path>
                <path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"></path>
              </svg>
            </span>
            <button class="locale-pill is-active" data-locale="ru" type="button">RU</button>
            <button class="locale-pill" data-locale="uk" type="button">UK</button>
            <button class="locale-pill" data-locale="en" type="button">EN</button>
            <button class="locale-pill" data-locale="es" type="button">ES</button>
          </div>

          <a class="header-cta" href="#pricing" data-i18n="site.start"></a>
        </div>
      </div>
    </header>

    <main id="top">
      <section class="hero section section-first">
        <div class="container">
          <div class="hero-card reveal reveal-visible">
            <div class="hero-media" aria-hidden="true"></div>
            <div class="hero-sheen" aria-hidden="true"></div>
            <div class="hero-content">
              <div class="hero-badge" data-i18n="hero.badge"></div>
              <h1 class="hero-title">
                <span class="hero-title-accent" data-i18n="hero.titleAccent"></span>
                <span data-i18n="hero.titleMain"></span>
              </h1>
              <p class="hero-copy" data-i18n="hero.text"></p>
              <div class="hero-actions">
                <a class="btn btn-primary" href="#pricing" data-i18n="hero.primary"></a>
                <a class="btn btn-secondary" href="#steps" data-i18n="hero.secondary"></a>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section problem">
        <div class="container">
          <div class="section-heading section-heading-centered reveal">
            <h2 class="display-xl" data-i18n="problem.title"></h2>
            <p class="section-copy section-copy-wide" data-i18n="problem.text"></p>
          </div>
          <div class="problem-grid" id="problemGrid"></div>
        </div>
      </section>

      <section class="section steps" id="steps">
        <div class="container">
          <div class="section-heading section-heading-centered reveal">
            <p class="eyebrow" data-i18n="steps.eyebrow"></p>
            <h2 class="display-hero display-wide" data-i18n="steps.title"></h2>
            <p class="section-copy section-copy-wide" data-i18n="steps.text"></p>
          </div>
          <div class="steps-grid" id="stepsGrid"></div>
        </div>
      </section>

      <section class="section banner-section">
        <div class="container">
          <div class="banner-card reveal">
            <img src="./assets/banner-crop.jpg" alt="" />
          </div>
        </div>
      </section>

      <section class="section split-section">
        <div class="container split-layout">
          <div class="media-card media-card-identity reveal">
            <img src="./assets/identity-crop.jpg" alt="" />
          </div>
          <div class="split-copy reveal">
            <p class="eyebrow" data-i18n="identity.eyebrow"></p>
            <h2 class="display-lg" data-i18n="identity.title"></h2>
            <p class="section-copy" data-i18n="identity.text"></p>
            <p class="section-copy section-copy-secondary" data-i18n="identity.textSecondary"></p>
            <ul class="bullet-list" id="identityBullets"></ul>
          </div>
        </div>
      </section>

      <section class="section split-section split-section-author">
        <div class="container split-layout">
          <div class="media-card media-card-author reveal">
            <img src="./assets/author-crop.jpg" alt="" />
          </div>
          <div class="split-copy reveal">
            <p class="eyebrow" data-i18n="author.eyebrow"></p>
            <h2 class="display-lg" data-i18n="author.title"></h2>
            <div class="paragraph-stack" id="authorParagraphs"></div>
            <ul class="check-list" id="authorBullets"></ul>
          </div>
        </div>
      </section>

      <section class="section pricing" id="pricing">
        <div class="container pricing-container">
          <div class="section-heading section-heading-centered reveal">
            <p class="eyebrow" data-i18n="pricing.eyebrow"></p>
            <h2 class="display-lg" data-i18n="pricing.title"></h2>
            <p class="section-copy section-copy-wide" data-i18n="pricing.text"></p>
          </div>

          <article class="pricing-card reveal">
            <div class="pricing-band" data-i18n="pricing.badge"></div>
            <div class="pricing-body">
              <div class="pricing-name" data-i18n="pricing.name"></div>
              <div class="pricing-subtitle" data-i18n="pricing.subtitle"></div>
              <div class="pricing-row">
                <span class="pricing-price" data-i18n="pricing.price"></span>
                <span class="pricing-old" data-i18n="pricing.oldPrice"></span>
                <span class="pricing-discount" data-i18n="pricing.discount"></span>
              </div>
              <ul class="check-list pricing-features" id="pricingFeatures"></ul>
              <div class="pricing-actions">
                <a class="btn btn-primary btn-block" href="#finalCta" data-i18n="pricing.cta"></a>
                <a
                  class="btn btn-outline btn-block"
                  href="https://t.me/+chugfitqfx5iMGQy"
                  target="_blank"
                  rel="noreferrer"
                  data-i18n="pricing.telegram"
                ></a>
              </div>
            </div>
          </article>
        </div>
      </section>

      <section class="section faq" id="faq">
        <div class="container faq-container">
          <div class="section-heading reveal">
            <h2 class="display-md" data-i18n="faq.title"></h2>
          </div>
          <div class="faq-list" id="faqList"></div>
        </div>
      </section>

      <section class="section cta-section" id="finalCta">
        <div class="container">
          <div class="cta-card reveal">
            <div class="cta-glow cta-glow-left" aria-hidden="true"></div>
            <div class="cta-glow cta-glow-right" aria-hidden="true"></div>
            <div class="cta-inner">
              <h2 class="display-xl display-light" data-i18n="cta.title"></h2>
              <p class="cta-copy" data-i18n="cta.text"></p>
              <a class="btn btn-primary btn-cta" href="#pricing" data-i18n="cta.primary"></a>
              <p class="cta-meta" data-i18n="cta.meta"></p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <a class="brand brand-footer" href="#top">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </span>
          <span class="brand-name">StyleSelf</span>
        </a>

        <nav class="footer-links">
          <a href="#steps" data-i18n="footer.how"></a>
          <a href="#pricing" data-i18n="footer.access"></a>
          <a href="https://t.me/+chugfitqfx5iMGQy" target="_blank" rel="noreferrer">Telegram</a>
          <a href="mailto:hello@styleself.app">hello@styleself.app</a>
        </nav>

        <div class="footer-copy" data-i18n="footer.copy"></div>
      </div>
    </footer>
  </body>
</html>
