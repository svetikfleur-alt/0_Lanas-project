name: ConnectBot cursor-fix release

on:
  push:
    branches:
      - tmp/connectbot-safe-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Fetch upstream sources
        shell: bash
        run: |
          git clone https://github.com/connectbot/connectbot.git cb
          git -C cb checkout 31f6cf825da5fc9987efbd6ff01a98236691cba9
          git clone https://github.com/connectbot/termlib.git termlib
          git -C termlib checkout 0.1.0

      - name: Apply cursor and repaint patch
        shell: bash
        run: |
          python3 tools/connectbot_cursor_patch.py
          cp tools/CursorResizeRegressionTest.kt termlib/lib/src/test/java/org/connectbot/terminal/CursorResizeRegressionTest.kt
          cp tools/ResizeScrollbackRegressionTest.kt termlib/lib/src/test/java/org/connectbot/terminal/ResizeScrollbackRegressionTest.kt
          git -C termlib diff --check
          git -C termlib diff --stat

      - name: Wire patched termlib
        shell: bash
        run: |
          cat >> cb/settings.gradle.kts <<'EOF'

          includeBuild("../termlib") {
              dependencySubstitution {
                  substitute(module("org.connectbot:termlib")).using(project(":lib"))
              }
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("cb/app/build.gradle.kts")
          s = p.read_text().replace('applicationId = "org.connectbot"', 'applicationId = "org.connectbot.fixed"', 1)
          p.write_text(s)
          p = Path("cb/app/src/main/res/values/notrans.xml")
          s = p.read_text().replace('<string name="app_name" translatable="false">ConnectBot</string>', '<string name="app_name" translatable="false">ConnectBot Fixed</string>', 1)
          p.write_text(s)
          p = Path("cb/gradle.properties")
          s = p.read_text().replace("org.gradle.configuration-cache=true", "org.gradle.configuration-cache=false", 1)
          p.write_text(s)
          PY

      - name: Generate release key
        shell: bash
        run: |
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/connectbot-fixed-release.jks" -storepass "$PASS" -keypass "$PASS" -alias connectbot-fixed -keyalg RSA -keysize 4096 -validity 3650 -dname "CN=ConnectBot Fixed Local Build, OU=Local Release, O=ConnectBot Fixed, C=SI"

      - name: Test cursor fix and termlib
        working-directory: termlib
        shell: bash
        run: |
          ./gradlew --no-daemon :lib:testDebugUnitTest --tests org.connectbot.terminal.CursorResizeRegressionTest --tests org.connectbot.terminal.ResizeScrollbackRegressionTest --stacktrace
          ./gradlew --no-daemon :lib:testDebugUnitTest --stacktrace

      - name: Build release APK
        working-directory: cb
        shell: bash
        run: |
          ./gradlew --no-daemon :app:lintOssRelease :app:assembleOssRelease -PkeystoreFile="$RUNNER_TEMP/connectbot-fixed-release.jks" -PkeystorePassword="$KEYSTORE_PASS" -PkeystoreAlias="connectbot-fixed" --stacktrace

      - name: Audit APK
        shell: bash
        run: |
          APK="cb/app/build/outputs/apk/oss/release/app-oss-release.apk"
          test -f "$APK"
          mkdir -p audit
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee audit/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee audit/permissions.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > audit/manifest-tree.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee audit/signature.txt
          grep -q "package: name='org.connectbot.fixed'" audit/badging.txt
          if grep -q "application-debuggable" audit/badging.txt; then exit 1; fi
          if grep -q "CN=Android Debug" audit/signature.txt; then exit 1; fi
          cp "$APK" ConnectBot_Fixed_Rotation_Cursor_RELEASE.apk
          sha256sum ConnectBot_Fixed_Rotation_Cursor_RELEASE.apk | tee audit/sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: connectbot-fixed-cursor-release
          retention-days: 14
          path: |
            ConnectBot_Fixed_Rotation_Cursor_RELEASE.apk
            audit/
