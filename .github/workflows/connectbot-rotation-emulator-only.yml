name: ConnectBot emulator-only rotation test

on:
  push:
    branches:
      - tmp/connectbot-rotation-fix
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  emulator-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download already-built APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifact
          gh run download 33967462239 \
            --repo "${{ github.repository }}" \
            --name connectbot-rotation-fixed \
            --dir artifact
          APK="$(find artifact -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "APK=$APK" | tee apk.env
          ls -lh "$APK"

      - name: Install screenshot checker
        shell: bash
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Android 14 portrait-landscape-portrait test
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            APK="$(find artifact -name '*.apk' -print -quit)"
            adb install -r "$APK"
            adb logcat -c

            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb shell am start -W -n org.connectbot.debug/org.connectbot.RotationProbeActivity
            sleep 3
            adb exec-out screencap -p > rotation_portrait_before.png

            adb shell settings put system user_rotation 1
            sleep 4
            adb exec-out screencap -p > rotation_landscape.png

            adb shell settings put system user_rotation 0
            sleep 4
            adb exec-out screencap -p > rotation_portrait_after.png

            python3 - <<'PY'
            from PIL import Image
            from pathlib import Path

            paths = [
                Path("rotation_portrait_before.png"),
                Path("rotation_landscape.png"),
                Path("rotation_portrait_after.png"),
            ]

            dims = [Image.open(p).size for p in paths]
            print("dimensions:", dims)
            assert dims[0][1] > dims[0][0], f"before is not portrait: {dims[0]}"
            assert dims[1][0] > dims[1][1], f"middle is not landscape: {dims[1]}"
            assert dims[2][1] > dims[2][0], f"after is not portrait: {dims[2]}"

            def bright_fraction(path):
                im = Image.open(path).convert("L")
                w, h = im.size
                crop = im.crop((int(w*0.05), int(h*0.06), int(w*0.95), int(h*0.94)))
                hist = crop.histogram()
                return sum(hist[170:]) / (crop.width * crop.height)

            vals = [bright_fraction(p) for p in paths]
            print("bright fractions:", vals)
            before, landscape, after = vals

            assert before > 0.006, f"terminal text not visible before rotation: {before}"
            assert landscape > 0.004, f"terminal appears blank after landscape rotation: {landscape}"
            assert after > 0.006, f"terminal appears blank after rotating back: {after}"
            assert landscape / before > 0.30, (before, landscape)
            assert after / before > 0.50, (before, after)

            print("ROTATION_TEST_PASS")
            PY

            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              adb logcat -d | tail -250
              exit 1
            fi

      - name: Upload passing APK and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectbot-rotation-emulator-result
          retention-days: 14
          path: |
            artifact/**/*.apk
            rotation_portrait_before.png
            rotation_landscape.png
            rotation_portrait_after.png
