name: ConnectBot rotation-fix build

on:
  push:
    branches:
      - tmp/connectbot-rotation-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
          echo "Installed Android platforms:"
          sdkmanager --list_installed | grep -E "platforms;android-|build-tools;" || true

      - name: Fetch pinned ConnectBot and patched termlib
        shell: bash
        run: |
          git clone https://github.com/connectbot/connectbot.git cb
          git -C cb checkout 31f6cf825da5fc9987efbd6ff01a98236691cba9

          git clone https://github.com/connectbot/termlib.git termlib
          git -C termlib checkout 0.1.0

          echo "ConnectBot: $(git -C cb rev-parse HEAD)"
          echo "termlib tag: $(git -C termlib describe --tags --exact-match)"
          echo "termlib SHA: $(git -C termlib rev-parse HEAD)"

      - name: Apply minimal resize/repaint patch only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("termlib/lib/src/main/java/org/connectbot/terminal/TerminalEmulator.kt")
          s = p.read_text()

          method_start = s.index("    override fun resize(newRows: Int, newCols: Int) {")
          next_doc = s.index("\n    /**", method_start)
          old = s[method_start:next_doc]

          required = [
              "// Capture current default colors (thread-safe)",
              "invalidateDisplay()",
              "removeStoredSegmentTexts(row)",
          ]
          missing = [needle for needle in required if needle not in old]
          if missing:
              raise SystemExit(f"Unexpected termlib 0.1.0 resize body, missing: {missing}")

          lines = [
              "    override fun resize(newRows: Int, newCols: Int) {",
              "        rows = newRows",
              "        cols = newCols",
              "        terminalNative.resize(newRows, newCols)",
              "",
              "        synchronized(damageLock) {",
              "            val currentDefaultFg = currentDefaultForeground",
              "            val currentDefaultBg = currentDefaultBackground",
              "",
              "            currentLines = List(newRows) { row ->",
              "                TerminalLine.empty(row, newCols, currentDefaultFg, currentDefaultBg)",
              "            }",
              "",
              "            pendingDamageRegions.clear()",
              "            pendingDamageRegions.add(",
              "                DamageRegion(",
              "                    startRow = 0,",
              "                    endRow = newRows,",
              "                    startCol = 0,",
              "                    endCol = newCols,",
              "                    preserveSegments = false,",
              "                ),",
              "            )",
              "            requestProcessPendingUpdatesLocked()",
              "        }",
              "",
              "        handler.post {",
              "            onResize?.invoke(TerminalDimensions(rows = rows, columns = cols))",
              "        }",
              "    }",
          ]
          new = "\n".join(lines)
          p.write_text(s[:method_start] + new + s[next_doc:])
          print("Applied minimal resize/repaint patch to exact termlib 0.1.0")

          # Composite builds reject mixed AGP versions. ConnectBot 1.10.9 uses
          # AGP 9.3.1 + Gradle 9.6.1, while termlib 0.1.0 shipped with
          # AGP 9.2.1 + Gradle 9.5.1. Align build tooling only; runtime source
          # remains the exact 0.1.0 tag plus the resize fix above.
          versions = Path("termlib/gradle/libs.versions.toml")
          vt = versions.read_text()
          old_agp = 'androidGradlePlugin = "9.2.1"'
          new_agp = 'androidGradlePlugin = "9.3.1"'
          if old_agp not in vt:
              raise SystemExit("Expected termlib AGP 9.2.1 not found")
          versions.write_text(vt.replace(old_agp, new_agp, 1))

          wrapper = Path("termlib/gradle/wrapper/gradle-wrapper.properties")
          wt = wrapper.read_text()
          old_gradle = "gradle-9.5.1-bin.zip"
          new_gradle = "gradle-9.6.1-bin.zip"
          if old_gradle not in wt:
              raise SystemExit("Expected termlib Gradle 9.5.1 wrapper not found")
          wrapper.write_text(wt.replace(old_gradle, new_gradle, 1))
          print("Aligned termlib build tooling to ConnectBot: AGP 9.3.1 / Gradle 9.6.1")
          PY

          git -C termlib diff --check
          git -C termlib diff -- lib/src/main/java/org/connectbot/terminal/TerminalEmulator.kt

      - name: Add resize/repaint regression tests
        shell: bash
        run: |
          cat > termlib/lib/src/test/java/org/connectbot/terminal/ResizeRepaintRegressionTest.kt <<'KOT'
          package org.connectbot.terminal

          import android.os.Looper
          import androidx.compose.ui.graphics.Color
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith
          import org.robolectric.RobolectricTestRunner
          import org.robolectric.Shadows
          import org.robolectric.annotation.LooperMode

          @RunWith(RobolectricTestRunner::class)
          @LooperMode(LooperMode.Mode.PAUSED)
          class ResizeRepaintRegressionTest {
              private fun visibleText(emulator: TerminalEmulatorImpl): String =
                  emulator.snapshot.value.lines.joinToString("\n") { line ->
                      line.cells.joinToString("") { cell -> cell.char.toString() }.trimEnd()
                  }

              @Test
              fun outputIsRebuiltAfterLandscapeResizeWithoutNewInput() {
                  val emulator = TerminalEmulatorFactory.create(
                      initialRows = 24,
                      initialCols = 80,
                      defaultForeground = Color.White,
                      defaultBackground = Color.Black,
                  ) as TerminalEmulatorImpl

                  val marker = "ROTATION_MARKER_7F3A"
                  emulator.writeInput(("C:\\Users\\maxin> echo $marker\r\n$marker\r\nC:\\Users\\maxin> ").toByteArray())
                  Shadows.shadowOf(Looper.getMainLooper()).idle()

                  assertTrue("marker missing before resize", visibleText(emulator).contains(marker))

                  emulator.resize(newRows = 12, newCols = 140)
                  Shadows.shadowOf(Looper.getMainLooper()).idle()

                  assertTrue(
                      "marker disappeared after portrait->landscape resize without any new terminal input",
                      visibleText(emulator).contains(marker),
                  )
              }

              @Test
              fun outputSurvivesRepeatedPortraitLandscapeRoundTrips() {
                  val emulator = TerminalEmulatorFactory.create(
                      initialRows = 24,
                      initialCols = 80,
                      defaultForeground = Color.White,
                      defaultBackground = Color.Black,
                  ) as TerminalEmulatorImpl

                  val marker = "ROUNDTRIP_MARKER_C91D"
                  emulator.writeInput(("$marker\r\n").repeat(8).toByteArray())
                  Shadows.shadowOf(Looper.getMainLooper()).idle()
                  assertTrue(visibleText(emulator).contains(marker))

                  repeat(8) {
                      emulator.resize(newRows = 12, newCols = 140)
                      Shadows.shadowOf(Looper.getMainLooper()).idle()
                      assertTrue("marker lost on landscape pass $it", visibleText(emulator).contains(marker))

                      emulator.resize(newRows = 24, newCols = 80)
                      Shadows.shadowOf(Looper.getMainLooper()).idle()
                      assertTrue("marker lost on portrait pass $it", visibleText(emulator).contains(marker))
                  }
              }
          }
          KOT

      - name: Run exact rotation regression tests
        working-directory: termlib
        shell: bash
        run: |
          ./gradlew --no-daemon :lib:testDebugUnitTest \
            --tests org.connectbot.terminal.ResizeRepaintRegressionTest \
            --stacktrace

      - name: Run full patched termlib unit suite
        working-directory: termlib
        shell: bash
        run: |
          ./gradlew --no-daemon :lib:testDebugUnitTest --stacktrace

      - name: Lint and assemble patched termlib
        working-directory: termlib
        shell: bash
        run: |
          ./gradlew --no-daemon :lib:lintDebug :lib:assembleRelease --stacktrace

      - name: Wire ConnectBot to patched termlib
        shell: bash
        run: |
          cat >> cb/settings.gradle.kts <<'KOT'

          includeBuild("../termlib") {
              dependencySubstitution {
                  substitute(module("org.connectbot:termlib")).using(project(":lib"))
              }
          }
          KOT

          python3 - <<'PY'
          from pathlib import Path
          p = Path("cb/app/src/main/res/values/notrans.xml")
          s = p.read_text()
          old = '<string name="app_name" translatable="false">ConnectBot</string>'
          new = '<string name="app_name" translatable="false">ConnectBot Fixed</string>'
          if old not in s:
              raise SystemExit("app_name resource not found")
          p.write_text(s.replace(old, new))

          # The included termlib 0.1.0 applies net.researchgate.release, whose
          # task listener is not configuration-cache compatible under Gradle 9.6.1.
          # Disable configuration cache for this CI composite build only.
          gp = Path("cb/gradle.properties")
          gt = gp.read_text()
          old_cc = "org.gradle.configuration-cache=true"
          new_cc = "org.gradle.configuration-cache=false"
          if old_cc not in gt:
              raise SystemExit("Expected ConnectBot configuration-cache setting not found")
          gp.write_text(gt.replace(old_cc, new_cc, 1))
          PY

      - name: Add on-device rotation probe
        shell: bash
        run: |
          mkdir -p cb/app/src/debug/java/org/connectbot
          mkdir -p cb/app/src/debug

          cat > cb/app/src/debug/java/org/connectbot/RotationProbeActivity.kt <<'KOT'
          package org.connectbot

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.sp
          import org.connectbot.terminal.Terminal
          import org.connectbot.terminal.TerminalEmulator
          import org.connectbot.terminal.TerminalEmulatorFactory

          private object RotationProbeStore {
              val emulator: TerminalEmulator = TerminalEmulatorFactory.create(
                  initialRows = 24,
                  initialCols = 80,
                  defaultForeground = Color.White,
                  defaultBackground = Color.Black,
              )

              var initialized = false

              fun ensureContent() {
                  if (initialized) return
                  initialized = true
                  val content = buildString {
                      append("\u001B[2J\u001B[H")
                      repeat(22) { row ->
                          append("ROTATION-PROBE-")
                          append(row.toString().padStart(2, '0'))
                          append("  WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW")
                          append("\r\n")
                      }
                  }
                  emulator.writeInput(content.toByteArray())
              }
          }

          class RotationProbeActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  RotationProbeStore.ensureContent()

                  setContent {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color.Black),
                      ) {
                          Terminal(
                              terminalEmulator = RotationProbeStore.emulator,
                              modifier = Modifier.fillMaxSize(),
                              initialFontSize = 14.sp,
                              backgroundColor = Color.Black,
                              foregroundColor = Color.White,
                              keyboardEnabled = false,
                              showSoftKeyboard = false,
                          )
                      }
                  }
              }
          }
          KOT

          cat > cb/app/src/debug/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application>
                  <!-- Keep upstream's debug-only Hilt host used by 100+ Robolectric/Compose tests. -->
                  <activity
                      android:name=".HiltComponentActivity"
                      android:exported="false" />
                  <activity
                      android:name="org.connectbot.RotationProbeActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified" />
              </application>
          </manifest>
          XML

      - name: Run ConnectBot unit tests
        working-directory: cb
        shell: bash
        run: |
          ./gradlew --no-daemon :app:testGoogleDebugUnitTest --stacktrace

      - name: Lint and build side-by-side debug APK
        working-directory: cb
        shell: bash
        run: |
          ./gradlew --no-daemon :app:lintGoogleDebug :app:assembleGoogleDebug --stacktrace

      - name: Verify APK package and signature
        shell: bash
        run: |
          APK="cb/app/build/outputs/apk/google/debug/app-google-debug.apk"
          test -f "$APK"
          echo "APK=$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -25
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='org.connectbot.debug'"

      - name: Install screenshot checker
        shell: bash
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Emulator rotation/repaint test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euxo pipefail
            APK="cb/app/build/outputs/apk/google/debug/app-google-debug.apk"
            adb install -r "$APK"
            adb logcat -c

            adb shell am start -W -n org.connectbot.debug/org.connectbot.RotationProbeActivity
            sleep 4
            adb exec-out screencap -p > rotation_portrait_before.png

            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 5
            adb exec-out screencap -p > rotation_landscape.png

            adb shell settings put system user_rotation 0
            sleep 5
            adb exec-out screencap -p > rotation_portrait_after.png

            python3 - <<'PY'
            from PIL import Image
            from pathlib import Path

            paths = [
                Path("rotation_portrait_before.png"),
                Path("rotation_landscape.png"),
                Path("rotation_portrait_after.png"),
            ]

            def bright_fraction(path):
                im = Image.open(path).convert("L")
                w, h = im.size
                crop = im.crop((int(w*0.06), int(h*0.08), int(w*0.94), int(h*0.92)))
                hist = crop.histogram()
                bright = sum(hist[180:])
                total = crop.width * crop.height
                return bright / total, crop.size

            values = []
            for p in paths:
                frac, size = bright_fraction(p)
                values.append(frac)
                print(f"{p}: crop={size}, bright_fraction={frac:.6f}")

            dims = [Image.open(p).size for p in paths]
            print("screenshot dimensions:", dims)
            assert dims[0][1] > dims[0][0], f"first screenshot is not portrait: {dims[0]}"
            assert dims[1][0] > dims[1][1], f"middle screenshot is not landscape: {dims[1]}"
            assert dims[2][1] > dims[2][0], f"final screenshot is not portrait: {dims[2]}"

            before, landscape, after = values
            assert before > 0.006, f"probe text not visible before rotation: {before}"
            assert landscape > 0.004, f"terminal repainted blank in landscape: {landscape}"
            assert after > 0.006, f"terminal repainted blank after rotating back: {after}"
            assert landscape / before > 0.35, (before, landscape)
            assert after / before > 0.55, (before, after)
            PY

            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | tail -5
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              adb logcat -d | tail -300
              exit 1
            fi

      - name: Upload APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectbot-rotation-fixed
          if-no-files-found: warn
          retention-days: 14
          path: |
            cb/app/build/outputs/apk/google/debug/app-google-debug.apk
            rotation_portrait_before.png
            rotation_landscape.png
            rotation_portrait_after.png
            termlib/lib/build/reports/tests/
            termlib/lib/build/reports/lint-results-debug.html
            cb/app/build/reports/tests/
            cb/app/build/reports/lint-results-googleDebug.html
