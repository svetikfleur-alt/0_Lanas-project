name: ConnectBot stable-grid fix

on:
  push:
    branches:
      - tmp/connectbot-lock-grid
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Fetch pinned upstream sources
        shell: bash
        run: |
          git clone https://github.com/connectbot/connectbot.git cb
          git -C cb checkout 31f6cf825da5fc9987efbd6ff01a98236691cba9
          git clone https://github.com/connectbot/termlib.git termlib
          git -C termlib checkout 0.1.0
          echo "ConnectBot: $(git -C cb rev-parse HEAD)"
          echo "termlib:    $(git -C termlib rev-parse HEAD)"

      - name: Apply stable-grid fix
        shell: bash
        run: |
          python3 tools/connectbot_lock_grid_patch.py
          cp tools/LockedGridRegressionTest.kt termlib/lib/src/test/java/org/connectbot/terminal/LockedGridRegressionTest.kt
          git -C termlib diff --check
          git -C cb diff --check
          echo "=== termlib runtime diff ==="
          git -C termlib diff -- lib/src/main/java/org/connectbot/terminal/Terminal.kt
          echo "=== ConnectBot console diff ==="
          git -C cb diff -- app/src/main/java/org/connectbot/ui/screens/console/ConsoleScreen.kt

      - name: Wire patched termlib and identify build
        shell: bash
        run: |
          cat >> cb/settings.gradle.kts <<'EOF'

          includeBuild("../termlib") {
              dependencySubstitution {
                  substitute(module("org.connectbot:termlib")).using(project(":lib"))
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("cb/app/build.gradle.kts")
          s = p.read_text()
          old = 'applicationId = "org.connectbot"'
          if old not in s:
              raise SystemExit("applicationId anchor not found")
          p.write_text(s.replace(old, 'applicationId = "org.connectbot.fixedgrid"', 1))

          p = Path("cb/app/src/main/res/values/notrans.xml")
          s = p.read_text()
          old = '<string name="app_name" translatable="false">ConnectBot</string>'
          if old not in s:
              raise SystemExit("app_name anchor not found")
          p.write_text(s.replace(old, '<string name="app_name" translatable="false">ConnectBot Fixed Grid</string>', 1))

          p = Path("cb/gradle.properties")
          s = p.read_text()
          if "org.gradle.configuration-cache=true" not in s:
              raise SystemExit("configuration-cache anchor not found")
          p.write_text(s.replace("org.gradle.configuration-cache=true", "org.gradle.configuration-cache=false", 1))
          PY

      - name: Add Android rotation probe
        shell: bash
        run: |
          mkdir -p cb/app/src/debug/java/org/connectbot
          mkdir -p cb/app/src/debug
          cat > cb/app/src/debug/java/org/connectbot/LockedGridProbeActivity.kt <<'KOT'
          package org.connectbot

          import android.content.res.Configuration
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.Log
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.ui.Modifier
          import org.connectbot.terminal.Terminal
          import org.connectbot.terminal.TerminalEmulator
          import org.connectbot.terminal.TerminalEmulatorFactory

          class LockedGridProbeActivity : ComponentActivity() {
              private lateinit var emulator: TerminalEmulator
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  emulator = TerminalEmulatorFactory.create()
                  setContent {
                      Terminal(
                          terminalEmulator = emulator,
                          modifier = Modifier.fillMaxSize(),
                          keyboardEnabled = false,
                          lockAutoSizeAfterFirstLayout = true,
                      )
                  }
                  handler.postDelayed({
                      repeat(120) { i ->
                          emulator.writeInput("PROBE-%03d unique-history\r\n".format(i).toByteArray())
                      }
                      emulator.writeInput("=== PROBE END ===\r\nprobe> ".toByteArray())
                      logDimensions("initial")
                  }, 1500)
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  logDimensions("config-immediate")
                  handler.postDelayed({ logDimensions("config-settled") }, 1500)
              }

              private fun logDimensions(phase: String) {
                  val d = emulator.dimensions
                  Log.i("LockedGridProbe", "LOCK_DIM phase=$phase rows=${d.rows} cols=${d.columns}")
              }
          }
          KOT

          cat > cb/app/src/debug/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application>
                  <activity
                      android:name=".HiltComponentActivity"
                      android:exported="false" />
                  <activity
                      android:name="org.connectbot.LockedGridProbeActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden" />
              </application>
          </manifest>
          XML

      - name: Run stable-grid regression and full termlib suite
        working-directory: termlib
        shell: bash
        run: |
          ./gradlew --no-daemon :lib:testDebugUnitTest --tests org.connectbot.terminal.LockedGridRegressionTest --stacktrace
          ./gradlew --no-daemon :lib:testDebugUnitTest --stacktrace
          ./gradlew --no-daemon :lib:lintDebug :lib:assembleDebug --stacktrace

      - name: Run ConnectBot unit tests
        working-directory: cb
        shell: bash
        run: |
          ./gradlew --no-daemon :app:testOssDebugUnitTest --stacktrace

      - name: Generate release key
        shell: bash
        run: |
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/connectbot-fixed-grid-release.jks" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias connectbot-fixed-grid \
            -keyalg RSA \
            -keysize 4096 \
            -validity 3650 \
            -dname "CN=ConnectBot Fixed Grid Local Build, OU=Local Release, O=ConnectBot Fixed Grid, C=SI"

      - name: Build release and debug probe APKs
        working-directory: cb
        shell: bash
        run: |
          ./gradlew --no-daemon \
            :app:lintOssRelease \
            :app:assembleOssRelease \
            :app:assembleOssDebug \
            -PkeystoreFile="$RUNNER_TEMP/connectbot-fixed-grid-release.jks" \
            -PkeystorePassword="$KEYSTORE_PASS" \
            -PkeystoreAlias="connectbot-fixed-grid" \
            --stacktrace

      - name: Audit release APK
        shell: bash
        run: |
          APK="cb/app/build/outputs/apk/oss/release/app-oss-release.apk"
          test -f "$APK"
          mkdir -p audit
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee audit/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee audit/permissions.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > audit/manifest-tree.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee audit/signature.txt
          grep -q "package: name='org.connectbot.fixedgrid'" audit/badging.txt
          ! grep -q "application-debuggable" audit/badging.txt
          ! grep -q "CN=Android Debug" audit/signature.txt
          ! grep -q "LockedGridProbeActivity" audit/manifest-tree.txt
          cp "$APK" ConnectBot_Fixed_Grid_RELEASE.apk
          sha256sum ConnectBot_Fixed_Grid_RELEASE.apk | tee audit/sha256.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Android 14 real rotation probe
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            APK="cb/app/build/outputs/apk/oss/debug/app-oss-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb shell am start -W -n org.connectbot.fixedgrid.debug/org.connectbot.LockedGridProbeActivity
            sleep 4
            adb exec-out screencap -p > probe_portrait_before.png

            adb shell settings put system user_rotation 1
            sleep 4
            adb exec-out screencap -p > probe_landscape.png

            adb shell settings put system user_rotation 0
            sleep 4
            adb exec-out screencap -p > probe_portrait_after.png

            adb logcat -d -s LockedGridProbe:I '*:S' | tee probe_dimensions.txt
            python3 - <<'PY'
            import re
            text = open("probe_dimensions.txt", encoding="utf-8").read()
            dims = [(int(r), int(c)) for r, c in re.findall(r"LOCK_DIM phase=\S+ rows=(\d+) cols=(\d+)", text)]
            print("probe dimensions:", dims)
            if len(dims) < 3:
                raise SystemExit("Not enough dimension samples from real rotation")
            if len(set(dims)) != 1:
                raise SystemExit(f"Native PTY grid changed during Android rotation: {dims}")
            print("LOCKED_GRID_ROTATION_PASS")
            PY
            ! adb logcat -d | grep -q "FATAL EXCEPTION"

      - name: Upload release and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectbot-fixed-grid-release
          retention-days: 14
          path: |
            ConnectBot_Fixed_Grid_RELEASE.apk
            audit/
            probe_dimensions.txt
            probe_portrait_before.png
            probe_landscape.png
            probe_portrait_after.png
