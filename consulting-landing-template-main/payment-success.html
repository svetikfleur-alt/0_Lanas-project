<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оплата принята — StyleSelf</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf8;
        color: #181513;
        font-family: Manrope, system-ui, sans-serif;
      }
      .card {
        width: min(92vw, 720px);
        padding: 40px;
        border-radius: 28px;
        background: #fffdfb;
        box-shadow: 0 20px 60px rgba(43, 28, 19, 0.08);
      }
      h1 {
        margin: 0 0 18px;
        font-size: clamp(2.2rem, 6vw, 3.5rem);
        line-height: 0.95;
      }
      p {
        margin: 0 0 14px;
        color: #6d625c;
        font-size: 1.05rem;
        line-height: 1.7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 0 24px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
      }
      .primary {
        background: #e87a43;
        color: white;
      }
      .secondary {
        border: 1px solid rgba(24, 21, 19, 0.12);
        color: #181513;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Оплата завершена.</h1>
      <p>Страница успеха не считается подтверждением оплаты сама по себе.</p>
      <p>Финальный доступ должен выдаваться только после серверной верификации webhook.</p>
      <div class="actions">
        <a class="primary" href="https://t.me/StyleSelf_with_Svetlana">Перейти в Telegram-канал</a>
        <a class="secondary" href="/">Вернуться на сайт</a>
      </div>
    </main>
  </body>
</html>
