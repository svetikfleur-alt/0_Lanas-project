<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оплата отменена — StyleSelf</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf8;
        color: #181513;
        font-family: Manrope, system-ui, sans-serif;
      }
      .card {
        width: min(92vw, 680px);
        padding: 40px;
        border-radius: 28px;
        background: #fffdfb;
        box-shadow: 0 20px 60px rgba(43, 28, 19, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.2rem, 6vw, 3.5rem);
        line-height: 0.95;
      }
      p {
        margin: 0 auto 14px;
        max-width: 42rem;
        color: #6d625c;
        font-size: 1.05rem;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 0 24px;
        margin-top: 18px;
        border-radius: 999px;
        background: #e87a43;
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Оплата была отменена.</h1>
      <p>Платёж не завершён. Можно вернуться на лендинг и попробовать ещё раз, когда будешь готов(а).</p>
      <a href="/">Вернуться на сайт</a>
    </main>
  </body>
</html>
